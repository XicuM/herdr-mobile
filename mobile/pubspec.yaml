name: herdr_mobile
description: "A terminal-first mobile client for Herdr AI coding agent workspaces."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  xterm: ^3.4.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
