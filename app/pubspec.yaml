name: herdr_mobile
description: "A terminal-first mobile client for Herdr AI coding agent workspaces."
publish_to: "none"
version: 1.4.0+7

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  xterm: ^4.0.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.3
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: MesloLGS Nerd Font Mono
      fonts:
        - asset: assets/fonts/MesloLGSNerdFontMono-Regular.ttf
        - asset: assets/fonts/MesloLGSNerdFontMono-Bold.ttf
          weight: 700
